name: CI

on:
  push:
    branches: [main]
  pull_request:

# Menor privilégio: o job só lê o repositório.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Valores fictícios: o build e os testes unitários não acessam o Supabase.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      SUPABASE_SERVICE_ROLE_KEY: placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

# Fora do CI de propósito: `npm run test:rls`, `npm run test:e2e` e `npm run a11y` exigem um
# projeto Supabase de TESTE com migrations e seed, e credenciais. Veja docs/TESTING.md.
